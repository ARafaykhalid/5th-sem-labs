<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Techno Event</title>
</head>
<body>

<header>
    <h1>Contact Us</h1>
</header>

<nav>
    <a href="index.html">Home</a> |
    <a href="about.html">About</a> |
    <a href="events.html">Events</a> |
    <a href="registration.html">Registration</a> |
    <a href="contact.html">Contact</a>
</nav>

<main>

<section>
    <h2>Contact Information</h2>

    <address>
        University Techno Event Committee<br>
        ABC University<br>
        Main Campus<br>
        Hyderabad, Pakistan<br>
        Email: technoevent@example.com<br>
        Phone: +92-300-1234567
    </address>
</section>

<section>
    <h2>Event Location</h2>

    <iframe
        src="https://www.google.com/maps"
        width="600"
        height="350"
        title="University Location">
    </iframe>
</section>

<section>
    <h2>Send Us a Message</h2>

    <form action="#" method="post">

        <label for="contact-name">Name:</label><br>
        <input type="text" id="contact-name" name="name" required><br><br>

        <label for="contact-email">Email:</label><br>
        <input type="email" id="contact-email" name="email" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="6" cols="40"></textarea><br><br>

        <input type="submit" value="Send Message">

    </form>
</section>

</main>

<footer>
    <p>@ 2026 University Techno Event</p>
</footer>

</body>
</html>
