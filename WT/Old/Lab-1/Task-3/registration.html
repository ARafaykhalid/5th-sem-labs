<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Techno Event</title>
</head>
<body>

<header>
    <h1>Techno Event Registration</h1>
</header>

<nav>
    <a href="index.html">Home</a> |
    <a href="about.html">About</a> |
    <a href="events.html">Events</a> |
    <a href="registration.html">Registration</a> |
    <a href="contact.html">Contact</a>
</nav>

<main>

<section>
    <h2>Participant Registration Form</h2>

    <form action="#" method="post">

        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone"><br><br>

        <label for="department">Department:</label><br>
        <select id="department" name="department">
            <option value="cs">Computer Science</option>
            <option value="it">Information Technology</option>
            <option value="engineering">Engineering</option>
            <option value="business">Business Administration</option>
        </select><br><br>

        <p>Select Event:</p>

        <input type="checkbox" id="programming" name="event" value="programming">
        <label for="programming">Programming</label><br>

        <input type="checkbox" id="robotics" name="event" value="robotics">
        <label for="robotics">Robotics</label><br>

        <input type="checkbox" id="web" name="event" value="web">
        <label for="web">Web Development</label><br>

        <input type="checkbox" id="gaming" name="event" value="gaming">
        <label for="gaming">Gaming</label><br><br>

        <label for="date">Preferred Date:</label><br>
        <input type="date" id="date" name="date"><br><br>

        <label for="message">Additional Message:</label><br>
        <textarea id="message" name="message" rows="5" cols="40"></textarea><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>
</section>

</main>

<footer>
    <p>@ 2026 University Techno Event</p>
</footer>

</body>
</html>
